<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ridge & Co. Home Services</title>
</head>
<body>
  <h1>Get a Quote</h1>

  <form id="leadForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">

    <label for="service">Service</label>
    <select id="service" name="service">
      <option value="">Select a service</option>
      <option>Landscaping</option>
      <option>Handyman / Repairs</option>
      <option>Remodeling</option>
      <option>Cleanup / Junk Removal</option>
      <option>Other</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" name="message"></textarea>

    <button type="submit">Send Request</button>
  </form>

  <p id="statusMsg"></p>

  <script>
    const form = document.getElementById('leadForm');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value || null,
        service: document.getElementById('service').value || null,
        message: document.getElementById('message').value || null,
      };

      try {
        const res = await fetch('http://127.0.0.1:8001/api/leads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) throw new Error('Request failed');

        statusMsg.textContent = "Thanks! We'll be in touch soon.";
        form.reset();
      } catch (err) {
        statusMsg.textContent = "Something went wrong. Please try again.";
      }
    });
  </script>
</body>
</html>
